[project]
name = "sespy-app"
version = "1.0.1"
description = "Research-oriented Shiny for Python UI for the SESPy library (Horizon Europe Marine-SABRES)"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "sespy[pdf,bayes] @ git+https://github.com/razinkele/SESPy@v1.18.0",
    "shiny>=1.7",
    "htmltools>=0.5",
    # The pyvis fork (v4.x, with `pyvis.shiny` for the CLD/graph view), on PyPI
    # as pyvis-optimized; never plain `pyvis` (pip would install upstream 0.3.2,
    # which has no `.shiny`).
    "pyvis-optimized>=4.4",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-playwright>=0.5", "pytest-asyncio>=0.23", "pytest-cov>=4"]
lint = ["ruff>=0.6", "mypy>=1.10"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: builds artefacts; run with -m slow"]
addopts = "-m \"not slow\""

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort. A focused, high-signal set —
# correctness + unused-import/name hygiene + import ordering.
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
# Test modules legitimately group imports into commented "sections" (e.g.
# importorskip guards, second topic-block imports), which trips E402; and
# e2e scripts embed long inline JS / absolute-path literals that can't wrap
# (E501).
"tests/**" = ["E402", "E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_configs = true
# Pragmatic baseline for a Shiny app being incrementally typed: the codebase
# is not yet mypy-clean, so CI runs this as a non-blocking signal (see
# .github/workflows/ci.yml). Tighten toward strict as modules are annotated.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sespy_app*"]

[tool.setuptools.package-data]
sespy_app = ["www/*.css"]
